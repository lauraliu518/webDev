<!DOCTYPE html>
<html>
    <head>
        <title>Matching Game</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <audio id="incorrect" src="media/wrong.wav"></audio>
        <audio id="correct" src="media/correct.wav"></audio>
        <h1>Matching Game</h1>

        <div id="panel_start">
            <p>Play a fast-paced game of memory and try and beat your best time</p>
            <select id="levelSelection">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button id="button_playgame">Play the Game</button>
        </div>

        <div id="panel_gameplaying" class="hidden">
            <div>Time elapsed: <span id="time_elapsed">0</div>
            <div id="token_container"></div>
        </div>

        <div id="panel_gameover" class="hidden">
            <h1 id="gameoverTitle">Game Over</h1>
            <div>Your time: <span id="time_yourtime">0</span></div>
            <div>Best time: <span id="time_besttime">0</span></div>
            <div id="playAgainBtn">Play Again</div>
            <div id="leaderboard">
                <div class="leaderboard-header"> 
                  <div class="column score">Score</div>
                  <div class="column name">Name</div>
                </div>
                
                <!-- Row 1 -->
                <div class="leaderboard-row">
                  <div class="column score"></div>
                  <div class="column name"></div>
                </div>
                
                <!-- Row 2 -->
                <div class="leaderboard-row">
                  <div class="column score"></div>
                  <div class="column name"></div>
                </div>
                
                <!-- Row 3 -->
                <div class="leaderboard-row">
                  <div class="column score"></div>
                  <div class="column name"></div>
                </div>
                
                <!-- Row 4 -->
                <div class="leaderboard-row">
                  <div class="column score"></div>
                  <div class="column name"></div>
                </div>
                
                <!-- Row 5 -->
                <div class="leaderboard-row">
                  <div class="column score"></div>
                  <div class="column name"></div>
                </div>
              </div>
              
        </div>

        <script>
            //audio references
            const incorrectSound = document.querySelector("#incorrect");
            const correctSound = document.querySelector("#correct");

            // DOM references
            const panel_start = document.getElementById('panel_start');
            const panel_gameplaying = document.getElementById('panel_gameplaying');
            const panel_gameover = document.getElementById('panel_gameover');

            // pre-game refs
            const button_playgame = document.getElementById('button_playgame');
            const levelSelection = document.querySelector("#levelSelection");


            //game play refs and variables
            const time_elapsed = document.getElementById('time_elapsed');
            const token_container = document.getElementById('token_container');
            let token1 = false; // set up global variables to keep track of what the user has clicked on 
            let token2 = false;
            let startTime; //time tracking variable
            let difficulty;
            let totalSelectedImgCount;
            let correctPairs;
            let clockIntervalId;

            //game over refs
            let totalTime;
            let time_yourtime = document.querySelector("#time_yourtime");
            let time_besttime = document.querySelector("#time_besttime");
            let playAgainBtn = document.querySelector("#playAgainBtn");



            // click the button to start the game
            button_playgame.onclick = function(event) {
                setDifficulty();
                panel_start.classList.add('hidden'); 
                gamePlay();
            }

            function setDifficulty(){
                difficulty = levelSelection.value;
                if(difficulty == "easy"){
                    totalSelectedImgCount = 6;
                    token_container.style.width = "400px";
                }else if(difficulty == "medium"){
                    totalSelectedImgCount = 10;
                    token_container.style.width = "500px";
                }else{
                    totalSelectedImgCount = 15;
                    token_container.style.width = "600px";
                }
            }

            function getCurrentTime(){
                now = new Date();
                console.log(now.getMilliseconds());
                return now.getMilliseconds();
            }

            function gamePlay(){
                correctPairs = 0;
                panel_gameplaying.classList.remove("hidden");
                startTime = Date.now();
                setInterval(function(){
                    currentTime = Date.now();
                    elapsedTime = currentTime-startTime;
                    time_elapsed.innerText = parseInt(elapsedTime/1000);
                }, 1000);

                // given: an array of image asset paths
                const assets = ['snorlax.png', 'electrabuzz.png', 'chansey.png', 'oddish.png',
                    'pikachu.png', 'paras.png', 'arcanine.png', 'ponita.png',
                    'venonat.png', 'eggsecute.png', 'machop.png', 'pidgey.png',
                    'psyduck.png', 'tauros.png', 'vulpix.png', 'gloom.png',
                    'krabby.png', 'butterfree.png', 'bulbasaur.png', 'clefairy.png',
                    'koffing.png', 'goldeen.png', 'magikarp.png', 'beedrill.png',
                    'lapras.png', 'meowth.png', 'ekans.png', 'jigglypuff.png',
                    'horsea.png', 'polywog.png', 'sandshrew.png', 'rattata.png',
                    'gengar.png', 'eevee.png', 'bellsprout.png', 'squirtle.png',
                    'seel.png', 'caterpie.png'];

                //create pokeballs array
                let selectedImages = randomizedSelection(assets, totalSelectedImgCount); // choose selected images (without pair)
                selectedImages = randomizedSelection(selectedImages.concat(selectedImages), 2*totalSelectedImgCount); // generate pair, randomize pair location


                // create our tokens that the user can click on
                for (let image of selectedImages) {
                    const el = document.createElement('img');
                    el.dataset.secretimage = `media/${image}`;
                    el.dataset.allowclick = true;
                    el.src = 'media/pokeball.png';
                    token_container.appendChild(el);

                    el.onclick = function(event) {
                        if(el.dataset.allowclick == "true"){
                            if (token1 == false) { //first click
                                el.src = el.dataset.secretimage;
                                event.currentTarget.dataset.allowclick = false;
                                token1 = el;   
                            }else { //second click, check match
                                token2 = el;
                                el.src = el.dataset.secretimage;

                                if (token1.dataset.secretimage == token2.dataset.secretimage) { //match
                                    correctSound.play();
                                    token1.dataset.allowclick = false;
                                    token2.dataset.allowclick = false;
                                    token1 = false;
                                    token2 = false;

                                    //if all pairs are found go to game over panel
                                    correctPairs += 1;
                                    if(correctPairs == totalSelectedImgCount){
                                        //save totalTime to global variable
                                        totalTime = parseInt(elapsedTime/1000);
                                        clearInterval(clockIntervalId); //stop stopwatch

                                        //hide game play and show game over
                                        panel_gameplaying.classList.add("hidden");
                                        gameOver();
                                    }
                                }
                                else { //mismatch
                                    incorrectSound.play();
                                    token1.dataset.allowclick = true;
                                    token2.dataset.allowclick = true;     
                                    
                                    //store reference for timeout function
                                    let t1 = token1;
                                    let t2 = token2;
                                    
                                    //reset tokens to prepare for fast clicking
                                    token1 = false;
                                    token2 = false;   

                                    setTimeout( function() { //flip back to pokeball image
                                        t1.src = 'media/pokeball.png';
                                        t2.src = 'media/pokeball.png';
                                    }, 500);
                                }
                            }
                        }
                    }
                }         
            }

            function gameOver(){
                panel_gameover.classList.remove("hidden");

                //your time
                time_yourtime.innerText = totalTime;
                
                //best time
                if(localStorage.getItem("bestTime")){ //previous record exists
                    if(localStorage.getItem("bestTime") > totalTime){//beat the record
                        localStorage.setItem("bestTime", totalTime); //set new record
                        time_besttime.innerText = `${totalTime} - New High Score!`;
                        enterLeaderboard();
                    }else{
                        time_besttime.innerText = localStorage.getItem("bestTime");
                    }
                }else{//no previous record
                    localStorage.setItem("bestTime", totalTime);
                    time_besttime.innerText = `${totalTime} - New High Score!`;
                    enterLeaderboard();
                }

                //remove previous pokeballs from container
                for (let i = token_container.children.length - 1; i >= 0; i--) {
                    token_container.children[i].remove();
                }

                //replay game
                playAgainBtn.onclick = function(e){
                    panel_gameover.classList.add("hidden");
                    gamePlay();
                }
            }
            
            function randomizedSelection(originalArr, selectCount){
                let selectedArr = [];

                for (let i = 0; i < selectCount ; i++) { //easy 6, medium 10, hard 15
                    let index = parseInt( Math.random() * originalArr.length );
                    selectedArr.push( originalArr[index] );
                    originalArr.splice( index, 1 );
                }
                
                return selectedArr;
            }

            function enterLeaderboard(){

            }
            
        </script>
    </body>
</html>
